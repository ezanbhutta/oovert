name: Build and deploy to Hostinger

# Runs on every change to main — including content saved from the CMS, which
# commits to main. Builds the Eleventy site and uploads the built _site folder
# to Hostinger over FTPS, so the live site stays in sync automatically.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Surface the secret as an env var so the deploy step can be skipped
    # (cleanly, no red run) until the FTP secrets are configured.
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Open Graph cards are rasterised from SVG at build time, and the
      # rasteriser resolves fonts through the host, not the site's webfonts.
      # A runner image without these renders every glyph as a tofu box, which
      # is exactly how a full set of broken cards once reached social. The
      # build also self-checks (see og-images.js) and fails rather than
      # shipping boxes.
      - name: Install the fonts the OG cards are drawn with
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation fontconfig

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      # Hostinger's FTPS control socket is often slow to establish from a
      # GitHub runner, which surfaces as "Timeout (control socket)" and fails an
      # otherwise-healthy deploy. The build above is deterministic; only the
      # upload is flaky. Two attempts at a 2-minute timeout were not enough:
      # both hit the ceiling on the same deploy and left the site a version
      # behind. The timeout is now 10 minutes (the sync is stateful, so a slow
      # run resumes rather than restarts) and there are three attempts, the
      # last of which is allowed to fail the job so a stuck deploy is visible
      # instead of silently leaving stale files live. server-dir is the folder that serves
      # oovert.com: usually /public_html/ for a primary domain, or
      # /domains/oovert.com/public_html/ for a secondary domain.
      - name: Upload _site to Hostinger (FTPS)
        id: ftp
        if: ${{ env.HAS_FTP != '' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 600000
          local-dir: ./_site/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}

      - name: Retry the upload if the first attempt timed out
        id: ftp2
        if: ${{ steps.ftp.outcome == 'failure' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 600000
          local-dir: ./_site/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}

      # Last attempt, and deliberately not continue-on-error: if this one fails
      # the deploy really is broken and the run should go red.
      - name: Final upload attempt
        if: ${{ steps.ftp.outcome == 'failure' && steps.ftp2.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 600000
          local-dir: ./_site/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}

      # Ping IndexNow (Bing / Yandex / Seznam) so they re-crawl changed URLs
      # within minutes. Runs after the upload, so the public key file and the
      # updated pages are already live when the engines verify. The script never
      # throws — continue-on-error is belt-and-braces so a hiccup can't fail a
      # deploy that already succeeded.
      - name: Notify IndexNow of updated URLs
        if: ${{ env.HAS_FTP != '' }}
        continue-on-error: true
        run: node tools/indexnow.js
